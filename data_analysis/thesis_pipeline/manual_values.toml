# Manual constants — numbers the CODE CANNOT PRODUCE.
# As-built/CAD dimensions, FEA results, datasheet figures, fitted literature
# constants, rig dimensions. Everything the design models compute (geometry,
# design point, velocity triangles, efficiencies) now comes from
# build_values.build_design() — do NOT re-add those here (duplicate keys
# make the build fail loudly, by design).
#
# Each [table] is ONE value. Fields:
#   val   (required)  the number (or a quoted string for a text label)
#   unit  (optional)  siunitx unit; single-quoted literal so backslashes are kept
#                     e.g. '\milli\meter', '\percent', '\watt', '\bar'. "" = dimensionless.
#   unc   (optional)  1-sigma uncertainty in the same unit
#   fmt   (optional)  python number format, default "g" (e.g. ".2f", ".3g")
#   desc  (optional)  note for yourself / the macro comment
#
# Edit here, never in LaTeX. Run build_values.py + export_latex.py to propagate.

[pump_rpm_maxreached]
val = 9000
unit = '\rpm'
desc = "maximum speed reached"

[supply_pump_head_design]
val = 2.2
unit = '\meter'
desc = "design head for the supply pump"

[lock_k1_original]
val = 0.17
fmt = ".2f"
desc = "original pre-rotation coefficient from Lock's paper"

[lock_k1_modified]
val = 0.53
fmt = ".2f"
desc = "modified pre-rotation coefficient"

# ---------- as-built / CAD (NOT what the sizing model outputs) ----------
[pump_throat]
val = 3.0
unit = '\milli\meter'
fmt = ".1f"
desc = "true diffuser throat (semicircle into annular casing; CAD-confirmed 2026-06-11 — the 3.8 mm cone cutwater is downstream of the minimum)"

[pump_throat_cutwater]
val = 3.8
unit = '\milli\meter'
desc = "cone cutwater diameter, downstream of the true throat (NOT the minimum area)"

# ---------- analysis constants quoted in prose ----------
[turb_start_limit]
val = 1.408
fmt = ".3f"
desc = "Goldman supersonic-starting limit (relative inlet Mach)"

# ---------- structural / FEA limits (hand-entered) ----------
[turb_blade_sf]
val = 39
desc = "blade-bending safety factor (FEA, Tough 2000)"

[turb_crit_speed]
val = 99000
unit = ''
desc = "first critical bending speed (ross, Al shaft) [rpm]"

# ---------- rig / build constants (the 'thickness of wood' example) ----------
[rig_baseplate_thk]
val = 20
unit = '\milli\meter'
desc = "CNC mounting baseplate thickness"
