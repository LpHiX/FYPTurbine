# Manual constants — numbers that do NOT come from data analysis.
# This is where the "random numbers" live: geometry, FEA/structural limits,
# material properties, rig dimensions, datasheet figures, etc.
#
# Each [table] is ONE value. Fields:
#   val   (required)  the number (or a quoted string for a text label)
#   unit  (optional)  siunitx unit; single-quoted literal so backslashes are kept
#                     e.g. '\milli\meter', '\percent', '\watt', '\bar'. "" = dimensionless.
#   unc   (optional)  1-sigma uncertainty in the same unit
#   fmt   (optional)  python number format, default "g" (e.g. ".2f", ".3g")
#   desc  (optional)  note for yourself / the macro comment
#
# Edit here, never in LaTeX. Run build_values.py + export_latex.py to propagate.
# NB: \rpm is not a built-in siunitx unit — add  \DeclareSIUnit\rpm{rpm}  to the
# preamble, or leave rpm values dimensionless (unit = "") and write "rpm" in prose.

[pump_rpm_design]
val = 20000
unit = '\rpm'
desc = "design shaft speed"

[pump_rpm_maxreached]
val = 9000
unit = '\rpm'
desc = "maximum speed reached"

